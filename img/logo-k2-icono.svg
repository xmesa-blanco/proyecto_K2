<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" role="img" aria-label="Icono K2: recicladora dentro de un pin de ubicación">
  <defs>
    <linearGradient id="pin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E8E3E"/>
      <stop offset="1" stop-color="#05432F"/>
    </linearGradient>
    <clipPath id="circ"><circle cx="100" cy="92" r="46"/></clipPath>
  </defs>
  <!-- Pin de ubicación -->
  <path d="M100 215 C60 170 20 140 20 95 A80 80 0 0 1 180 95 C180 140 140 170 100 215 Z" fill="url(#pin)"/>
  <circle cx="100" cy="92" r="62" fill="#ffffff"/>
  <!-- Flechas de reciclaje -->
  <path d="M53 74.9 A50 50 0 0 1 147 74.9" fill="none" stroke="#7AC70C" stroke-width="9" stroke-linecap="round"/>
  <polygon points="154.5,72.3 151.1,86.2 139.5,77.5" fill="#7AC70C" stroke="#7AC70C" stroke-width="3" stroke-linejoin="round"/>
  <path d="M147 109.1 A50 50 0 0 1 53 109.1" fill="none" stroke="#1E8E3E" stroke-width="9" stroke-linecap="round"/>
  <polygon points="45.95,111.7 48.9,97.8 60.05,106.5" fill="#1E8E3E" stroke="#1E8E3E" stroke-width="3" stroke-linejoin="round"/>
  <!-- Recicladora -->
  <g clip-path="url(#circ)">
    <!-- cola de caballo -->
    <path d="M87 72 Q68 74 70 96 Q72 108 80 112 Q78 96 90 84 Z" fill="#05432F"/>
    <!-- cuello y cuerpo -->
    <rect x="94" y="88" width="12" height="16" fill="#05432F"/>
    <path d="M60 140 Q62 106 84 101 L116 101 Q138 106 140 140 Z" fill="#05432F"/>
    <!-- chaleco -->
    <path d="M83 102 L90 102 L100 108 L110 102 L117 102 L122 140 L78 140 Z" fill="#7AC70C"/>
    <!-- cabeza -->
    <circle cx="100" cy="76" r="15" fill="#05432F"/>
    <!-- gorra -->
    <path d="M84.5 74 A15.5 15.5 0 0 1 115.5 74 Z" fill="#7AC70C"/>
    <path d="M108 70 Q126 68 128 75 Q118 78 108 76 Z" fill="#7AC70C"/>
    <!-- símbolo reciclaje -->
    <g transform="translate(100 121)">
      <circle r="8" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-dasharray="11 5.2" transform="rotate(-20)"/>
      <polygon points="0,-12 5,-6 -5,-6" fill="#fff" transform="rotate(30)"/>
      <polygon points="0,-12 5,-6 -5,-6" fill="#fff" transform="rotate(150)"/>
      <polygon points="0,-12 5,-6 -5,-6" fill="#fff" transform="rotate(270)"/>
    </g>
  </g>
</svg>
